<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>CISC3012 Study Notes · Ch1–Ch3</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-kicker">CISC3012</p>
          <strong id="brand-title">Ch1–Ch3 Study Notes</strong>
        </div>
      </div>
      <nav id="toc" class="toc" aria-label="Contents"></nav>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Open contents">Contents</button>
        <div class="modes" role="tablist">
          <button type="button" class="mode" data-mode="read" role="tab">Read</button>
          <button type="button" class="mode" data-mode="cards" role="tab">Cards</button>
          <button type="button" class="mode" data-mode="quiz" role="tab">Quiz</button>
        </div>
        <label class="search">
          <span class="sr" id="search-label">Search notes</span>
          <input id="search" type="search" placeholder="Search the notes…" autocomplete="off">
        </label>
        <div class="lang">
          <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"></circle>
              <ellipse cx="12" cy="12" rx="4.2" ry="9" fill="none" stroke="currentColor" stroke-width="1.7"></ellipse>
              <path d="M3.2 12h17.6M4.6 8.2h14.8M4.6 15.8h14.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            </svg>
            <span id="lang-label">EN</span>
          </button>
          <div class="lang-menu" id="lang-menu" hidden role="listbox" aria-label="Language">
            <button type="button" data-lang="en" role="option">English</button>
            <button type="button" data-lang="zh" role="option">中文</button>
          </div>
        </div>
        <p class="progress" id="progress" aria-live="polite"></p>
      </header>

      <section id="view-read" class="view">
        <div class="read-tools">
          <button type="button" id="skim-btn" class="chip">Skim: headings, lists, and tables</button>
          <p id="search-meta" class="meta"></p>
        </div>
        <article id="article" class="article"></article>
      </section>

      <section id="view-cards" class="view" hidden>
        <div class="review-head">
          <div>
            <h1 id="cards-title">Flashcards</h1>
            <p class="lede" id="cards-lede">Answer first, then flip the card. What you remember stays in this browser.</p>
          </div>
          <div class="filters" id="card-filters"></div>
        </div>
        <p class="meta" id="card-meta"></p>
        <div class="card-scene">
          <button type="button" class="card-inner" id="card">
            <span class="card-face card-front">
              <span class="tag" id="card-tag"></span>
              <span class="card-text" id="card-front"></span>
              <span class="hint" id="card-hint">Click, or press Space, to flip</span>
            </span>
            <span class="card-face card-back">
              <span class="tag" id="card-answer-label">Answer</span>
              <span class="card-text" id="card-back"></span>
            </span>
          </button>
        </div>
        <div class="card-actions">
          <button type="button" id="card-prev" class="btn ghost">Previous</button>
          <button type="button" id="card-again" class="btn warn">Still learning</button>
          <button type="button" id="card-known" class="btn good">Got it</button>
          <button type="button" id="card-next" class="btn ghost">Next</button>
        </div>
      </section>

      <section id="view-quiz" class="view" hidden>
        <div class="review-head">
          <div>
            <h1 id="quiz-title">Quiz</h1>
            <p class="lede" id="quiz-lede">Pick one answer. Wrong questions are kept so you can practice only those.</p>
          </div>
          <div class="filters">
            <button type="button" class="chip" id="quiz-restart">Start over</button>
            <button type="button" class="chip" id="quiz-wrong">Wrong answers only</button>
          </div>
        </div>
        <div id="quiz-play">
          <p class="meta" id="quiz-meta"></p>
          <div class="quiz-card">
            <p class="tag" id="quiz-tag"></p>
            <h2 id="quiz-q"></h2>
            <div id="quiz-choices" class="choices"></div>
            <div id="quiz-why" class="why" hidden></div>
          </div>
          <div class="card-actions">
            <button type="button" id="quiz-next" class="btn" disabled>Next question</button>
          </div>
        </div>
        <div id="quiz-done" class="quiz-card done" hidden>
          <h2 id="quiz-score"></h2>
          <p id="quiz-score-detail"></p>
          <div class="card-actions">
            <button type="button" id="quiz-review-wrong" class="btn">Review wrong answers</button>
            <button type="button" id="quiz-again" class="btn ghost">Try again</button>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="content.js?v=4"></script>
  <script src="content-en.js?v=4"></script>
  <script src="review-data.js?v=4"></script>
  <script src="review-en.js?v=4"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
